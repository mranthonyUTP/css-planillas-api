# HU-02: análisis de SonarQube / SonarCloud.
# Ajustar sonar.organization y sonar.projectKey al proyecto creado en SonarCloud.
sonar.organization=mranthonyutp
sonar.projectKey=mranthonyUTP_css-planillas-api
sonar.projectName=css-planillas-api
