# HU-10: infraestructura de staging en Render (Blueprint). Render › New › Blueprint › este repositorio.
databases:
  - name: planillas-db
    plan: free
    databaseName: planillas

services:
  - type: web
    name: css-planillas-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /salud
    autoDeploy: false   # lo despliega el workflow tras pasar el CI
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: planillas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: local
      - key: CORS_ORIGIN
        value: https://css-planillas-web.onrender.com

  - type: web
    name: css-planillas-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://css-planillas-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
