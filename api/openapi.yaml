openapi: 3.1.0
info:
  title: Portal de revisión de planillas
  version: 0.2.0
  description: Prevalidación y contraste con referencia; sin presentación ni pago
    ante CSS.
servers:
- url: http://localhost:3000
paths:
  /salud:
    get:
      operationId: salud
      description: Estado del servicio.
      security: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /metricas:
    get:
      operationId: metricas
      description: Requiere el token de métricas configurado, independiente del JWT.
      responses:
        '200':
          description: Métricas Prometheus.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: ingresar
      description: Cuentas locales de demostración. Deshabilitado en producción.
      security: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ruc
              - usuario
              - clave
              properties:
                ruc:
                  type: string
                usuario:
                  type: string
                clave:
                  type: string
  /reglas:
    get:
      operationId: reglas
      description: Reglas activas del formato demo de cinco columnas.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /planillas:
    get:
      operationId: listarPlanillas
      description: Planillas de la empresa autenticada, con resultado automático del último intento.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Historial de planillas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumenSerie'
  /planillas/validar:
    post:
      operationId: validar
      description: Solo ELABORADOR. Un serieId explícito crea una corrección de esa
        serie, conservando empresa, período y tipo originales y los intentos anteriores.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intento'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - archivo
              - periodo
              - tipo
              properties:
                archivo:
                  type: string
                  format: binary
                referencia:
                  type: string
                  format: binary
                  description: Nómina opcional del mismo período (.csv o .xlsx, máximo 5 MB). Contrasta presencia y sueldo por identidad; las diferencias no certifican errores ni bloquean por sí mismas la validación de formato.
                periodo:
                  type: string
                  pattern: ^\d{4}-(0[1-9]|1[0-2])$
                tipo:
                  type: string
                  enum:
                  - Regular
                  - Complementaria
                  - Corrección
                serieId:
                  type: string
                  format: uuid
  /planillas/{id}:
    parameters:
    - &id001
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: detallePlanilla
      description: Detalle e intentos de una serie del ámbito autorizado.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleSerie'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /planillas/{id}/comparar:
    parameters:
    - *id001
    get:
      operationId: compararIntentos
      description: Compara dos intentos de la misma serie por identidad, incluidos
        históricos. Devuelve conflictos si no se puede emparejar con certeza.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparacion'
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: anterior
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: actual
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /cargas:
    get:
      operationId: listarCargas
      description: Registro de cargas de la empresa autenticada.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Solicitud inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Falta autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permiso insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No encontrado en el ámbito permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Estado o versión incompatible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /planillas/{id}/enviar-operador:
    post:
      operationId: enviarAlOperador
      description: El responsable envía el intento actual sin observaciones de formato a una única revisión interna.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intentoId]
              properties:
                intentoId: { type: string, format: uuid }
      responses:
        '200':
          description: Planilla con revisión interna pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleSerie' }
        '400': { description: Solicitud o clave inválida. }
        '401': { description: Falta autenticación. }
        '403': { description: El perfil no permite enviar. }
        '404': { description: Planilla no encontrada en la empresa asignada. }
        '409': { description: Intento inválido, desactualizado o estado incompatible. }
  /planillas/{id}/decision-operador:
    post:
      operationId: decidirRevisionOperador
      description: El operador de la empresa autoriza internamente o devuelve con motivo el intento actual pendiente. No presenta la planilla ante CSS.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intentoId, decision]
              properties:
                intentoId: { type: string, format: uuid }
                decision: { type: string, enum: [autorizar, devolver] }
                motivo: { type: string, maxLength: 1000, description: Obligatorio al devolver. }
      responses:
        '200':
          description: Decisión registrada sobre el intento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleSerie' }
        '400': { description: Solicitud, clave o motivo inválido. }
        '401': { description: Falta autenticación. }
        '403': { description: El perfil no es operador. }
        '404': { description: Planilla no encontrada en la empresa asignada. }
        '409': { description: Intento desactualizado, clave reutilizada o estado incompatible. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        mensaje:
          type: string
        codigo:
          type: string
    Empresa:
      type: object
      properties:
        ruc:
          type: string
        nombre:
          type: string
    Sesion:
      type: object
      properties:
        token:
          type: string
        usuario:
          type: string
        rol:
          type: string
          enum:
          - ELABORADOR
          - OPERADOR
        empresa:
          $ref: '#/components/schemas/Empresa'
        empresas:
          type: array
          items:
            $ref: '#/components/schemas/Empresa'
    Observacion:
      type: object
      properties:
        fila:
          type: integer
        campo:
          type: string
        campoId:
          type: string
        valor:
          type: string
        problema:
          type: string
        solucion:
          type: string
    Trabajador:
      type: object
      properties:
        clave:
          type: string
        tipoDocumento:
          type: string
        documento:
          type: string
        seguroSocial:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        nombreCompleto:
          type: string
        sueldo:
          type: string
        fila:
          type: integer
        valido:
          type: boolean
        rubros:
          type: object
          additionalProperties:
            type: string
        adicionales:
          type: object
          additionalProperties:
            type: string
        errores:
          type: array
          items:
            $ref: '#/components/schemas/Observacion'
    Intento:
      type: object
      properties:
        contraste:
          $ref: '#/components/schemas/Contraste'
        id:
          type: string
        serieId:
          type: string
        archivo:
          type: string
        usuario:
          type: string
        empresaRuc:
          type: string
        empresaNombre:
          type: string
        formato:
          type: string
        periodo:
          type: string
        tipo:
          type: string
        validadaEn:
          type: string
        numero:
          type: integer
        filas:
          type: integer
        filasConError:
          type: integer
        salariosValidos:
          type: integer
        valida:
          type: boolean
        estructuraValida:
          type: boolean
        totalSalariosParcial:
          type: boolean
        totalSalarios:
          type: number
        errores:
          type: array
          items:
            $ref: '#/components/schemas/Observacion'
        trabajadores:
          type: array
          items:
            $ref: '#/components/schemas/Trabajador'
    Contraste:
      type: object
      description: Resultado conservado por intento. No calcula cuotas ni certifica la referencia o la aceptación de la CSS. Ausente en intentos históricos anteriores a esta función.
      properties:
        version:
          type: integer
          enum: [1]
        estado:
          type: string
          enum: [no_realizado, no_comparable, realizado]
        referencia:
          type: [object, 'null']
          properties:
            archivo:
              type: string
        comprobado:
          type: array
          items:
            type: string
        noVerificado:
          type: array
          items:
            type: string
        diferencias:
          type: array
          items:
            type: object
            properties:
              codigo:
                type: string
                enum: [SUELDO_DISTINTO, SOLO_REFERENCIA, SOLO_PLANILLA]
              resultado:
                type: string
                enum: [para_revisar]
              referencia:
                $ref: '#/components/schemas/PersonaContraste'
              planilla:
                $ref: '#/components/schemas/PersonaContraste'
        sinDiferencias:
          type: array
          items:
            $ref: '#/components/schemas/PersonaContraste'
        conflictos:
          type: array
          items:
            type: object
            properties:
              lado:
                type: string
                enum: [planilla, referencia]
              fila:
                type: integer
              codigo:
                type: string
                enum: [ESTRUCTURA_INVALIDA, SUELDO_ILEGIBLE, IDENTIDAD_AMBIGUA]
              motivo:
                type: string
    PersonaContraste:
      type: [object, 'null']
      properties:
        clave:
          type: string
        fila:
          type: integer
        documento:
          type: string
        nombre:
          type: string
        sueldo:
          type: string
    ResumenSerie:
      type: object
      properties:
        revisionInterna:
          $ref: '#/components/schemas/RevisionInterna'
        id:
          type: string
        empresaRuc:
          type: string
        empresaNombre:
          type: string
        periodo:
          type: string
        tipo:
          type: string
        ultimoIntentoId:
          type: string
        creadaEn:
          type: string
        actualizadaEn:
          type: string
        estado:
          type: string
          enum:
          - FORMATO_INVALIDO
          - CONTRASTE_NO_COMPARABLE
          - SIN_REFERENCIA
          - DIFERENCIAS_POR_REVISAR
          - SIN_DIFERENCIAS
        numeroIntentos:
          type: integer
        ultimoIntentoResumen:
          $ref: '#/components/schemas/Intento'
    RevisionInterna:
      type: object
      properties:
        estado: { type: string, enum: [SIN_ENVIAR, PENDIENTE, AUTORIZADA, DEVUELTA] }
        intentoId: { type: string, format: uuid }
        usuario: { type: string }
        motivo: { type: string }
        fecha: { type: string, format: date-time }
        accion: { type: string, enum: [enviar-operador, autorizar-operador, devolver-operador] }
    DetalleSerie:
      allOf:
      - $ref: '#/components/schemas/ResumenSerie'
      - type: object
        properties:
          intentos:
            type: array
            items:
              $ref: '#/components/schemas/Intento'
          revisionesInternas:
            type: array
            description: Movimientos internos conservados por intento, sin claves de idempotencia.
            items:
              $ref: '#/components/schemas/RevisionInterna'
    Comparacion:
      type: object
      properties:
        comparable:
          type: boolean
        anterior:
          type: object
        actual:
          type: object
        cambios:
          type: array
          items:
            type: object
        altas:
          type: array
          items:
            $ref: '#/components/schemas/Trabajador'
        bajas:
          type: array
          items:
            $ref: '#/components/schemas/Trabajador'
        sinCambios:
          type: integer
        totales:
          type: object
        conflictos:
          type: array
          items:
            type: object
